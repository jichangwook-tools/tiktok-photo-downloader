name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Project Files
        working-directory: ./tiktok_downloader_app
        run: |
          # Tự động đồng bộ cấu hình Gradle chuẩn Flutter
          flutter create --platforms=android --org com.jichangwook --project-name tiktok_photo_downloader .
          
          # Cấp quyền lưu trữ và internet vào AndroidManifest
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml
          
          # Đảm bảo AndroidX được bật
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Dependencies
        working-directory: ./tiktok_downloader_app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./tiktok_downloader_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Photo-Downloader-APK
          path: tiktok_downloader_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
