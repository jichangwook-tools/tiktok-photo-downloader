name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Project
        working-directory: ./tiktok_downloader_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.jichangwook --project-name tiktok_photo_downloader .
          
          python3 -c "
          import os, glob

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  c = f.read()
              perms = '''    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />\n'''
              c = c.replace('<application', perms + '    <application')
              with open(manifest_path, 'w') as f:
                  f.write(c)

          for bg_file in glob.glob('android/app/build.gradle*'):
              with open(bg_file, 'r') as f:
                  bg = f.read()
              bg = bg.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              bg = bg.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              bg = bg.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
              bg = bg.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
              with open(bg_file, 'w') as f:
                  f.write(bg)
          "

      - name: Install Dependencies
        working-directory: ./tiktok_downloader_app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./tiktok_downloader_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Photo-Downloader-APK
          path: tiktok_downloader_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
