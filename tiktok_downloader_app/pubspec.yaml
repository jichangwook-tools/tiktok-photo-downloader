name: tiktok_photo_downloader
description: TikTok Photo Downloader Without Watermark — by JiChangWook - Wook @J2TeamDev
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.4

  # Networking & APIs
  http: ^1.2.0
  dio: ^5.4.0

  # Device & Storage
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  image_gallery_saver_plus: ^3.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
